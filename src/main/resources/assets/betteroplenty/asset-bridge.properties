# Asset bridge manifest -- Better O' Plenty
#
# Maps a file inside a player-supplied copy of Biomes O' Plenty onto the path this mod
# wants that art at. THIS MOD SHIPS NONE OF THE FILES ON THE LEFT. The bridge only ever
# reads a copy the player already has on disk; nothing is downloaded and nothing is
# redistributed.
#
#   <trailing path inside the archive> = <path inside the generated texture pack>
#
# Keys are the last two path segments, lower case, because BOP has thirteen base-name
# collisions -- blank.png is a block and an item, dandelion.png is a block and a
# particle, six armour textures share a name with their item icon, and all four mobs
# have a say.ogg and a hurt.ogg. A key written without a slash is matched on base name
# instead, which is what the Minecraft section at the bottom uses.
#
# The value may be a comma-separated list, for one upstream file that feeds several
# paths here.
#
# GENERATED by tools/gen_asset_bridge_manifest.py -- do not hand-edit.

